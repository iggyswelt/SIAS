<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIAS Dashboard V4</title>
<style>
:root{--primary:#f59e0b;--primary-dim:#b45309;--bg:#050505;--bg-secondary:#0a0a0a;--card:#0d0d0d;--card-hover:#141414;--border:#1a1a1a;--text:#d1d5db;--text-dim:#4b5563;--sidebar:#080808;--accent:var(--primary);--accent2:var(--primary-dim);--bg2:var(--card);--bg3:var(--border);--text2:var(--text-dim);--success:#22c55e;--danger:#ef4444;--info:#3b82f6;--gray:#6b7280;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--sidebar);padding:20px 0;border-right:1px solid var(--border);flex-shrink:0}
.sidebar h2{color:var(--text);padding:0 20px 20px;font-size:1.1rem;letter-spacing:1px}
.sidebar a{display:block;padding:12px 20px;color:var(--text-dim);text-decoration:none;transition:.2s;border-left:3px solid transparent}
.sidebar a:hover{color:var(--text);background:rgba(255,255,255,.03);border-left-color:var(--text-dim)}
.sidebar a.active{color:var(--primary);background:rgba(245,158,11,.06);border-left-color:var(--primary)}
.main{flex:1;padding:30px;overflow-y:auto}
h1{font-size:1.5rem;margin-bottom:20px;color:var(--text)}
.card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h3{color:var(--text);margin-bottom:12px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.stat-value{font-size:2rem;font-weight:700;color:var(--text)}
.stat-label{color:var(--text2);font-size:.85rem;margin-top:4px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.badge-running{background:#3b82f620;color:var(--info)}
.badge-done{background:#22c55e20;color:var(--success)}
.badge-failed{background:#ef444420;color:var(--danger)}
.badge-pending{background:#6b728020;color:var(--gray)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;color:var(--text2);font-size:.8rem;text-transform:uppercase;border-bottom:1px solid var(--bg3)}
td{padding:10px 12px;border-bottom:1px solid var(--bg3);font-size:.9rem}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--bg3);padding:6px 10px;border-radius:var(--radius);font-size:.85rem}
.health-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.health-up{background:var(--success)}.health-down{background:var(--danger)}.health-unknown{background:var(--gray)}
.demo-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:20px;transition:.2s}
.demo-card:hover{border-color:var(--accent)}
.agent-card{text-align:center;padding:24px}
.agent-name{font-weight:600;margin-top:8px;color:var(--text)}
.agent-role{color:var(--text2);font-size:.85rem}
.log-box{background:var(--bg);border:1px solid var(--bg3);border-radius:var(--radius);padding:16px;font-family:monospace;font-size:.8rem;max-height:400px;overflow-y:auto;color:var(--text2);white-space:pre-wrap}
.filter-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
@media(max-width:768px){.sidebar{width:60px}.sidebar h2,.sidebar a span{display:none}.sidebar a{padding:14px 0;text-align:center}}
</style>
</head>
<body>
<nav class="sidebar">
<h2>⚡ SIAS V4</h2>
<a href="/" class="{{'active' if active=='dashboard'}}"><span>📊 Dashboard</span></a>
<a href="/tasks" class="{{'active' if active=='tasks'}}"><span>📋 Tasks</span></a>
<a href="/demos" class="{{'active' if active=='demos'}}"><span>🎬 Demos</span></a>
<a href="/youtube" class="{{'active' if active=='youtube'}}"><span>▶️ YouTube</span></a>
<a href="/agents" class="{{'active' if active=='agents'}}"><span>🤖 Agents</span></a>
<a href="/news" class="{{'active' if active=='news'}}"><span>📰 News</span></a>
<a href="/mail" class="{{'active' if active=='mail'}}"><span>📧 Mail</span></a>
<a href="/imgtools" class="{{'active' if active=='imgtools'}}"><span>🖼 IMG</span></a>
<a href="/settings" class="{{'active' if active=='settings'}}"><span>⚙️ Settings</span></a>
</nav>
<div class="main">
{% block content %}{% endblock %}
</div>
<script>
async function loadStats(){
  try{const r=await fetch('/api/dashboard-stats');const d=await r.json();
    ['token_today','token_week','token_total'].forEach(k=>{const e=document.getElementById(k);if(e)e.textContent=d[k]||'0'});
    ['postgres','redis','gateway'].forEach(k=>{const e=document.getElementById('health-'+k);if(e){e.className='health-dot health-'+(d[k]||'unknown')}});
    const de=document.getElementById('disk-free');if(de)de.textContent=(d.disk_free_gb||'?')+' GB / '+(d.disk_total_gb||'?')+' GB';
  }catch(e){}
}
document.addEventListener('DOMContentLoaded',loadStats);
setInterval(loadStats,30000);
</script>
</body>
</html>
