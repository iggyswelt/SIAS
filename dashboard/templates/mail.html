{% extends "base.html" %}
{% block content %}
<h1>📧 Mail</h1>

<style>
.mail-layout{display:grid;grid-template-columns:35% 65%;gap:1rem;height:calc(100vh - 200px);min-height:500px}
.mail-folder-list{display:flex;flex-direction:column;gap:4px}
.mail-folder-item{padding:.6rem .8rem;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:.6rem;transition:background .15s, border-left .15s;border-left:3px solid transparent}
.mail-folder-item:hover{background:rgba(255,255,255,.05)}
.mail-folder-item.active{background:rgba(0,255,136,.08);border-left-color:var(--accent)}
.mail-folder-item .folder-icon{font-size:1.1rem}
.mail-folder-item .folder-name{flex:1;font-size:.9rem}
.mail-folder-item .folder-badge{background:var(--accent);color:#fff;padding:1px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.mail-row{cursor:pointer;transition:background .15s}
.mail-row:hover{background:rgba(255,255,255,.05)}
.mail-row.unread{font-weight:600}
#mail-preview{overflow-y:auto}
#mail-preview .preview-header{border-bottom:1px solid var(--border);padding-bottom:.8rem;margin-bottom:.8rem}
</style>

<div class="mail-layout">
  <!-- LEFT: Folder Tree (35%) -->
  <div style="overflow-y:auto">
    <div class="card" style="padding:1rem;height:100%">
      <h3 style="margin:0 0 .8rem 0;font-size:.95rem;color:var(--accent)">📂 Ordner</h3>
      <div class="mail-folder-list">
        <div class="mail-folder-item active" data-folder="inbox" onclick="switchMailFolder('inbox',this)">
          <span class="folder-icon">📥</span>
          <span class="folder-name">Posteingang</span>
          <span class="folder-badge" id="badge-inbox">—</span>
        </div>
        <div class="mail-folder-item" data-folder="sent" onclick="switchMailFolder('sent',this)">
          <span class="folder-icon">📤</span>
          <span class="folder-name">Gesendet</span>
          <span class="folder-badge" id="badge-sent" style="background:var(--text2)">—</span>
        </div>
        <div class="mail-folder-item" data-folder="drafts" onclick="switchMailFolder('drafts',this)">
          <span class="folder-icon">📝</span>
          <span class="folder-name">Entwürfe</span>
          <span class="folder-badge" id="badge-drafts" style="background:var(--text2)">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Mail List + Preview (65%) -->
  <div style="display:flex;flex-direction:column;gap:1rem;overflow:hidden">
    <!-- Mail List -->
    <div class="card" style="padding:1rem;flex:1;overflow-y:auto;min-height:200px">
      <div id="mail-count" style="color:var(--text2);font-size:.8rem;margin-bottom:.5rem">Laden...</div>
      <table style="width:100%;border-collapse:collapse;font-size:.85rem">
        <thead><tr style="border-bottom:2px solid var(--border)">
          <th style="text-align:left;padding:.5rem;width:30%">Absender</th>
          <th style="text-align:left;padding:.5rem">Betreff</th>
          <th style="text-align:left;padding:.5rem;width:100px">Datum</th>
          <th style="text-align:center;padding:.5rem;width:30px">📎</th>
        </tr></thead>
        <tbody id="mail-tbody"><tr><td colspan="4" style="text-align:center;color:var(--text2);padding:2rem">Laden...</td></tr></tbody>
      </table>
    </div>

    <!-- Preview Pane -->
    <div id="mail-preview" class="card" style="padding:1rem;display:none;max-height:50%">
      <div class="preview-header">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h3 id="preview-subject" style="margin:0;font-size:1rem;color:var(--accent)"></h3>
          <button onclick="closeMailPreview()" style="background:none;border:none;color:var(--text2);font-size:1.2rem;cursor:pointer">✕</button>
        </div>
        <div id="preview-meta" style="color:var(--text2);font-size:.8rem;margin-top:.4rem"></div>
      </div>
      <div id="preview-body" style="white-space:pre-wrap;font-size:.9rem;line-height:1.6;max-height:300px;overflow-y:auto"></div>
    </div>
  </div>
</div>

<script>
let currentFolder = 'inbox';
let currentMails = [];

function switchMailFolder(folder, el) {
  currentFolder = folder;
  document.querySelectorAll('.mail-folder-item').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  else document.querySelector('.mail-folder-item[data-folder="'+folder+'"]').classList.add('active');
  closeMailPreview();
  loadMails(folder);
}

function loadMails(folder) {
  const tbody = document.getElementById('mail-tbody');
  const countEl = document.getElementById('mail-count');
  tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text2);padding:2rem">Laden...</td></tr>';
  countEl.textContent = 'Laden...';

  fetch('/api/mails/himalaya?folder=' + folder + '&limit=50').then(r => r.json()).then(data => {
    currentMails = data.emails || [];
    tbody.innerHTML = '';
    // Update badge
    const badge = document.getElementById('badge-' + folder);
    if (badge) {
      badge.textContent = currentMails.length;
      badge.style.background = currentMails.length > 0 ? 'var(--accent)' : 'var(--text2)';
    }
    if (currentMails.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text2);padding:2rem">Keine Mails in ' + folder + '</td></tr>';
      countEl.textContent = '0 Mails';
      return;
    }
    currentMails.forEach((m, i) => {
      const isUnread = !m.flags || !m.flags.includes('\\Seen');
      const tr = document.createElement('tr');
      tr.className = 'mail-row' + (isUnread ? ' unread' : '');
      tr.style.borderBottom = '1px solid var(--border)';
      tr.onclick = () => openMailPreview(m, i);
      tr.innerHTML =
        '<td style="padding:.4rem">'+m.from+'</td>'+
        '<td style="padding:.4rem">'+(m.subject||'(kein Betreff)')+'</td>'+
        '<td style="padding:.4rem;font-size:.75rem;color:var(--text2)">'+(m.date||'—').substring(0,16)+'</td>'+
        '<td style="padding:.4rem;text-align:center">'+(m.has_attachment?'📎':'')+'</td>';
      tbody.appendChild(tr);
    });
    countEl.textContent = currentMails.length + ' Mails';
  }).catch(err => {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#ef4444">Fehler: '+err.message+'</td></tr>';
    countEl.textContent = 'Fehler';
  });
}

function openMailPreview(m, idx) {
  document.getElementById('preview-subject').textContent = m.subject || '(kein Betreff)';
  document.getElementById('preview-meta').innerHTML =
    '<strong>Von:</strong> ' + m.from + ' (' + (m.from_addr||'') + ')<br>' +
    '<strong>An:</strong> ' + m.to + (m.to_addr ? ' (' + m.to_addr + ')' : '') + '<br>' +
    '<strong>Datum:</strong> ' + m.date;
  document.getElementById('preview-body').innerHTML = 'Laden...';
  document.getElementById('mail-preview').style.display = 'block';

  fetch('/api/mails/himalaya/read', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: m.id, folder: currentFolder})
  }).then(r => r.json()).then(data => {
    if (data.status === 'success') {
      document.getElementById('preview-body').textContent = data.body || data.text || '(kein Inhalt)';
    } else {
      document.getElementById('preview-body').textContent = 'Fehler: ' + (data.error || 'Unbekannt');
    }
  }).catch(err => {
    document.getElementById('preview-body').textContent = 'Fehler: ' + err.message;
  });
}

function closeMailPreview() {
  document.getElementById('mail-preview').style.display = 'none';
}

// Initial load
loadMails('inbox');
</script>
{% endblock %}
