<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Network – metamaus Command Center</title>
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@9/dist/gridstack.min.css"/>
 <script src="https://cdn.jsdelivr.net/npm/gridstack@9/dist/gridstack-all.min.js"></script>
 <style>
 .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 20px; }
 .device-card { 
  background: #0f1624; border: 1px solid #00ff9d33; border-radius: 10px; 
  padding: 16px; cursor: pointer; transition: all 0.2s; 
 }
 .device-card:hover { border-color: #00ff9d; box-shadow: 0 0 25px #00ff9d60; transform: scale(1.05); z-index: 10; }
 .card-mac { font-size: 0.85em; color: #a0a0ff; margin-top: 4px; }
 .card-notes { font-size: 0.85em; color: #ff9d00; margin-top: 4px; font-style: italic; }
 .card-ip { font-size: 1.2em; color: #00ff9d; font-weight: bold; }
 .card-host { color: #a0a0ff; font-size: 0.9em; }
 .status-online { color: #00ff9d; font-weight: bold; }
 .status-offline { color: #ff4d4d; font-weight: bold; }
 .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; }
 .modal-content { background: #0f1624; border: 1px solid #00ff9d; border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; color: #e0e0ff; }
 .close { float: right; font-size: 24px; cursor: pointer; color: #ff4d4d; padding: 5px 10px; border: 1px solid #ff4d4d; border-radius: 4px; }
 .close:hover { background: #ff4d4d; color: white; }
 
 body { background: #0a0a0f; color: #e0e0e0; font-family: sans-serif; margin: 0; padding: 20px; }
 h1 { color: #00ff9d; margin-bottom: 20px; }
 .back-btn { display: inline-block; background: #222; color: #00ff9d; padding: 10px 20px; border-radius: 8px; text-decoration: none; margin-bottom: 20px; border: 1px solid #333; }
 .back-btn:hover { background: #333; }
 .card-vendor { color: #888; font-size: 0.8em; margin-top: 4px; }
 .card-ports { color: #ffa500; font-size: 0.75em; margin-top: 4px; }
 </style>
</head>
<body>
 
 
 <div id="devices-container" class="device-grid"></div>

 <!-- Modal -->
 <div id="device-modal" class="modal">
  <div class="modal-content">
   <span class="close" onclick="document.getElementById('device-modal').style.display='none'">Close</span>
   <h2 id="modal-title"></h2>
   <div id="modal-body"></div>
  </div>
 </div>

 <script>
 fetch('/api/network/devices')
 .then(r => r.json())
 .then(devices => {
  const container = document.getElementById('devices-container');
  if (!devices || devices.length === 0) {
   container.innerHTML = '<div style="color:#888;grid-column:1/-1;">Keine Geräte gefunden. Starte einen Netzwerk-Scan!</div>';
   return;
  }
  container.innerHTML = devices.map(d => `
   <div class="device-card" onclick="showDevice('${d.ip}')">
    <div class="card-ip">${d.ip}</div>
    <div class="card-host">${d.hostname || 'unknown'}</div>
    <div class="${d.status?.toLowerCase() === 'up' || d.status?.toLowerCase() === 'online' ? 'status-online' : 'status-offline'}">
     ${d.status?.toLowerCase() === 'up' || d.status?.toLowerCase() === 'online' ? '🟢 ONLINE' : '🔴 OFFLINE'}
    </div>
    <div style="margin-top:8px;color:#666;font-size:0.85em">${d.device_type || '?'}</div>
    <div class="card-vendor">${d.vendor || '-'}</div>
    <div class="card-mac">MAC: ${d.mac_address ? d.mac_address.substring(0,8) + '...' : '-'}</div>
    <div class="card-ports">${d.open_ports ? 'Ports: ' + d.open_ports : 'Ports: None'}</div>
    ${d.notes ? `<div class="card-notes">Notes: ${d.notes.substring(0,30)}${d.notes.length > 30 ? '...' : ''}</div>` : ''}
   </div>
  `).join('');
 })
 .catch(err => console.error('Fetch error:', err));

 function showDevice(ip) {
  fetch(`/api/network/device/${ip}`)
  .then(r => r.json())
  .then(d => {
   document.getElementById('modal-title').textContent = `${d.ip} – ${d.hostname || 'Unknown'}`;
   document.getElementById('modal-body').innerHTML = `
    <p><b>Status:</b> ${d.status}</p>
    <p><b>Type:</b> ${d.device_type || '-'}</p>
    <p><b>MAC (full):</b> ${d.mac_address || '-'}</p>
    <p><b>Vendor:</b> ${d.vendor || '-'}</p>
    <p><b>Open Ports:</b> ${d.open_ports || 'None'}</p>
    <p><b>First Seen:</b> ${d.first_seen || '-'}</p>
    <p><b>Last Seen:</b> ${d.last_seen || '-'}</p>
    <p><b>Notes (full):</b><br>
    <textarea id="notes-text" rows="4" style="width:100%; background:#1a1f2e; color:#e0e0ff; border:1px solid #00ff9d;">${d.notes || ''}</textarea><br>
    <button onclick="saveNotes('${d.ip}')" style="margin-top:10px; padding:8px 16px; background:#00ff9d; color:black; border:none; border-radius:6px; cursor:pointer;">Save Notes</button>
   </p>
   `;
   document.getElementById('device-modal').style.display = 'flex';
  });
 }

 function saveNotes(ip) {
  const notes = document.getElementById('notes-text').value;
  fetch('/api/network/update', {
   method: 'POST',
   headers: {'Content-Type': 'application/json'},
   body: JSON.stringify({ip: ip, notes: notes})
  })
  .then(r => r.json())
  .then(data => {
   if (data.success) {
    alert('Notes saved successfully!');
    document.getElementById('device-modal').style.display = 'none';
    location.reload();
   } else {
    alert('Error: ' + (data.error || 'Unknown'));
   }
  })
  .catch(err => alert('Save failed: ' + err));
 }
 
 // Close modal on outside click
 document.getElementById('device-modal').addEventListener('click', function(e) {
  if (e.target === this) this.style.display = 'none';
 });
 </script>
</body>
</html>
