<!DOCTYPE html>
<html lang="de">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>🗺️ NGO Map – Rheingold</title>
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 20px; padding: 12px 20px; background: rgba(0,0,0,0.6); border-bottom: 2px solid #EAB308; flex-shrink: 0; }
  .topbar h1 { color: #EAB308; font-size: 1.3em; text-shadow: 0 0 15px rgba(234,179,8,0.5); }
  .stats-bar { display: flex; gap: 20px; margin-left: auto; font-size: 0.95em; }
  .stat-pill { background: rgba(234,179,8,0.15); border: 1px solid rgba(234,179,8,0.4); border-radius: 20px; padding: 4px 14px; color: #EAB308; }
  .layout { display: flex; flex: 1; overflow: hidden; }
  #sidebar { width: 360px; flex-shrink: 0; background: #0f1624; border-right: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }
  #sidebar-header { padding: 14px 16px; border-bottom: 1px solid #333; background: rgba(234,179,8,0.08); flex-shrink: 0; }
  #sidebar-header h2 { color: #EAB308; font-size: 1.05em; margin-bottom: 6px; }
  #sidebar-search { width: 100%; padding: 7px 12px; background: #1a2030; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; font-size: 0.9em; }
  #sidebar-search:focus { border-color: #EAB308; outline: none; }
  #ngo-list { overflow-y: auto; flex: 1; }
  .ngo-card { padding: 12px 16px; border-bottom: 1px solid #1a2540; cursor: pointer; transition: background 0.15s; }
  .ngo-card:hover { background: rgba(234,179,8,0.1); }
  .ngo-card.active { background: rgba(234,179,8,0.18); border-left: 3px solid #EAB308; }
  .ngo-name { color: #e0e0e0; font-size: 0.95em; font-weight: 600; margin-bottom: 3px; }
  .ngo-type { display: inline-block; font-size: 0.72em; background: rgba(0,255,136,0.15); color: #00ff9d; border: 1px solid rgba(0,255,136,0.3); border-radius: 4px; padding: 1px 7px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .ngo-funding { color: #4ade80; font-size: 0.9em; font-weight: 600; }
  .ngo-address { color: #666; font-size: 0.8em; margin-top: 2px; }
  .ngo-no-coords { color: #ffa500; font-size: 0.72em; margin-top: 2px; }
  #map { flex: 1; background: #0a0a0f; }
  .leaflet-popup-content-wrapper { background: #0f1624; border: 1px solid #EAB308; border-radius: 10px; color: #e0e0e0; }
  .leaflet-popup-tip { background: #0f1624; }
  .popup-name { font-size: 1.1em; font-weight: bold; color: #EAB308; margin-bottom: 6px; }
  .popup-row { font-size: 0.88em; margin: 3px 0; color: #ccc; }
  .popup-label { color: #888; }
  .popup-funding { color: #4ade80; font-weight: bold; font-size: 1em; }
  .loading-overlay { position: fixed; inset: 0; background: rgba(10,10,15,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; color: #EAB308; font-size: 1.2em; }
  .legend { background: rgba(10,10,15,0.85); border: 1px solid #333; border-radius: 8px; padding: 10px 14px; font-size: 0.8em; line-height: 1.8; }
 </style>
</head>
<body>
<div class="loading-overlay" id="loading"><div>🦅 Lade NGO-Daten…</div></div>
<div class="topbar">
 <span style="font-size:1.4em">🗺️</span>
 <h1>NGO Map – Rheingold</h1>
 <div class="stats-bar">
  <span class="stat-pill" id="stat-total">— Total</span>
  <span class="stat-pill" id="stat-mapped">— Auf Karte</span>
  <span class="stat-pill" id="stat-unmapped">— Ohne Koordinaten</span>
 </div>
 <button onclick="location.reload()" style="margin-left:auto;background:#1a1a2e;color:#EAB308;border:1px solid #EAB308;padding:6px 16px;border-radius:6px;cursor:pointer">🔄 Refresh</button>
 <button onclick="parent.switchTab && parent.switchTab('rheingold')" style="background:#1a1a2e;color:#888;border:1px solid #333;padding:6px 16px;border-radius:6px;cursor:pointer">← Zurück</button>
</div>
<div class="layout">
 <div id="sidebar">
  <div id="sidebar-header">
   <h2>🗺️ NGOs</h2>
   <input type="text" id="sidebar-search" placeholder="🔍 NGO suchen…" oninput="filterNGOs(this.value)">
  </div>
  <div id="ngo-list"><div style="padding:20px;color:#555;text-align:center;font-size:0.9em">Laden…</div></div>
 </div>
 <div id="map"></div>
</div>
<script>
const map = L.map('map', { center: [51.1657, 10.4515], zoom: 6 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 18
}).addTo(map);

const ngoIcon = L.divIcon({
  html: '<div style="background:#EAB308;width:14px;height:14px;border-radius:50%;border:2px solid #0a0a0f;box-shadow:0 0 8px rgba(234,179,8,0.8)"></div>',
  className: '', iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -10]
});
const ngoIconHighlighted = L.divIcon({
  html: '<div style="background:#00ff9d;width:18px;height:18px;border-radius:50%;border:2px solid #0a0a0f;box-shadow:0 0 12px rgba(0,255,157,0.9)"></div>',
  className: '', iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -12]
});

L.control({ position: 'bottomright' }).onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<div style="color:#EAB308;font-weight:bold;margin-bottom:6px">🗺️ Legende</div>' +
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div style="background:#EAB308;width:12px;height:12px;border-radius:50%;border:2px solid #333;flex-shrink:0"></div><span>NGO (mit Koordinaten)</span></div>' +
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div style="background:#ffa500;width:12px;height:12px;border-radius:50%;border:2px solid #333;flex-shrink:0"></div><span>NGO (ohne Koordinaten)</span></div>' +
    '<div style="margin-top:6px;color:#888;font-size:0.95em">Sidebar-Klick zeigt Karte</div>';
  return div;
}.addTo(map);

let allNGOs = [];
let markers = {};
let noCoordMarkers = {};
let activeEntityId = null;

async function loadNGOs() {
  try {
    const res = await fetch('/api/rheingold/ngo-map');
    const geojson = await res.json();
    document.getElementById('loading').style.display = 'none';
    if (!geojson.features || geojson.features.length === 0) {
      document.getElementById('ngo-list').innerHTML = '<div style="padding:30px;color:#555;text-align:center">Keine NGOs gefunden.<br><br>Koordinaten werden durch den Rheingold-Crawler eingetragen.</div>';
      document.getElementById('stat-total').textContent = '0 Total';
      return;
    }
    allNGOs = geojson.features;
    const meta = geojson.meta || {};
    document.getElementById('stat-total').textContent = meta.total + ' Total';
    document.getElementById('stat-mapped').textContent = meta.with_coords + ' Auf Karte';
    document.getElementById('stat-unmapped').textContent = meta.without_coords + ' Ohne Koord.';
    renderNGOsToSidebar(allNGOs);
    plotNGOs(allNGOs);
  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('ngo-list').innerHTML = '<div style="padding:20px;color:#ff4444">Fehler: ' + err.message + '</div>';
  }
}

function renderNGOsToSidebar(ngos) {
  const list = document.getElementById('ngo-list');
  if (!ngos || ngos.length === 0) {
    list.innerHTML = '<div style="padding:20px;color:#555;text-align:center">Keine Ergebnisse</div>';
    return;
  }
  list.innerHTML = ngos.map(n => {
    const p = n.properties || n;
    const entity_id = p.entity_id || Math.random();
    const hasCoords = !!(n.geometry && n.geometry.coordinates);
    const funding = formatFunding(p.funding_total);
    return '<div class="ngo-card" id="ngo-card-' + entity_id + '" ' +
      'onclick="selectNGO(' + entity_id + ', ' + hasCoords + ')" ' +
      'data-name="' + (p.entity_name || '').toLowerCase() + '">' +
      '<div class="ngo-name">' + escHtml(p.entity_name || 'Unbekannt') + '</div>' +
      '<span class="ngo-type">' + escHtml(p.entity_type || 'ngo') + '</span> ' +
      '<span class="ngo-funding">' + funding + '</span>' +
      (p.city ? '<div class="ngo-address">📍 ' + escHtml(p.city) + '</div>' : '') +
      (!hasCoords ? '<div class="ngo-no-coords">⚠️ Keine Koordinaten</div>' : '') +
      '</div>';
  }).join('');
}

function filterNGOs(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.ngo-card').forEach(card => {
    card.style.display = (card.dataset.name || '').includes(q) ? '' : 'none';
  });
}

function plotNGOs(ngos) {
  ngos.forEach(n => {
    const p = n.properties || n;
    const entity_id = p.entity_id;
    if (!n.geometry || !n.geometry.coordinates) {
      const circle = L.circleMarker([51.5, 10.0], {
        radius: 8, fillColor: '#ffa500', color: '#ff8800', weight: 2, opacity: 0.8, fillOpacity: 0.3
      }).addTo(map);
      circle.bindPopup(buildPopup(p));
      circle.on('click', () => selectNGO(entity_id, false));
      noCoordMarkers[entity_id] = circle;
      return;
    }
    const [lng, lat] = n.geometry.coordinates;
    const marker = L.marker([lat, lng], { icon: ngoIcon }).addTo(map);
    marker.bindPopup(buildPopup(p));
    marker.on('click', () => selectNGO(entity_id, true));
    markers[entity_id] = marker;
  });
}

function buildPopup(p) {
  const funding = formatFunding(p.funding_total);
  const conf = p.confidence_score ? (parseFloat(p.confidence_score) * 100).toFixed(0) + '%' : '—';
  const flags = (p.risk_flags || []).slice(0, 3).join(', ') || '—';
  const address = [p.address, p.city, p.country].filter(Boolean).join(', ') || '—';
  const summary = (p.summary || '—').substring(0, 120);
  return '<div class="popup-name">' + escHtml(p.entity_name || '—') + '</div>' +
    '<div class="popup-row"><span class="popup-label">Typ: </span><b>' + escHtml(p.entity_type || 'ngo') + '</b></div>' +
    '<div class="popup-row"><span class="popup-label">Fördersumme: </span><span class="popup-funding">' + funding + '</span></div>' +
    '<div class="popup-row"><span class="popup-label">Adresse: </span>' + escHtml(address) + '</div>' +
    '<div class="popup-row"><span class="popup-label">Confidence: </span>' + conf + '</div>' +
    '<div class="popup-row"><span class="popup-label">Risk Flags: </span>' + escHtml(flags) + '</div>' +
    (summary !== '—' ? '<div class="popup-row" style="margin-top:6px;border-top:1px solid #333;padding-top:6px">' + escHtml(summary) + '</div>' : '');
}

function selectNGO(entity_id, hasCoords) {
  if (activeEntityId && markers[activeEntityId]) {
    markers[activeEntityId].setIcon(ngoIcon);
  }
  document.querySelectorAll('.ngo-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('ngo-card-' + entity_id);
  if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  if (hasCoords && markers[entity_id]) {
    markers[entity_id].setIcon(ngoIconHighlighted);
    markers[entity_id].openPopup();
    const ll = markers[entity_id].getLatLng();
    map.setView([ll.lat, ll.lng], Math.max(map.getZoom(), 10), { animate: true });
  }
  activeEntityId = entity_id;
}

function formatFunding(val) {
  if (!val || val == null || val === 0) return '—';
  const n = parseFloat(val);
  if (n >= 1000000) return '€' + (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return '€' + Math.round(n / 1000) + 'k';
  return '€' + n.toFixed(0);
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadNGOs();
</script>
</body>
</html>
